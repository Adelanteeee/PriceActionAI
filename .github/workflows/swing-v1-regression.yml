name: Swing v1 Regression

on:
  push:
    branches:
      - sprint1-swing-v1-lock
      - main
  pull_request:
    branches:
      - main

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install --upgrade pip pytest pandas plotly
      - name: Compile locked Swing engine
        run: python -m py_compile src/price_action_ai_swing_v1.py
      - name: Run locked regression suite
        run: pytest -q tests/test_swing_v1_lock.py
