name: Leg Metrics Regression

on:
  push:
    branches:
      - sprint2-leg-baseline
  pull_request:
    branches:
      - sprint2-leg-baseline
      - main

jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --upgrade pip pytest pandas plotly
      - name: Compile locked Swing, Data Integrity, Leg and auditor
        run: |
          python -m py_compile \
            src/price_action_ai_swing_v1.py \
            src/price_action_ai_swing_v1_locked.py \
            src/price_action_ai_data_integrity_cr.py \
            src/price_action_ai_leg_v0.py \
            research/PriceActionAI_Leg_Metrics_Hardening_Auditor.py
      - name: Run locked Swing and Leg baseline regressions
        run: |
          pytest -q \
            tests/test_swing_v1_lock.py \
            tests/test_leg_v0_baseline.py \
            tests/test_leg_v0_real_snapshot.py \
            tests/test_gold_leg_multitf_visual_validator.py
      - name: Run locked Leg metrics and Data Integrity regressions
        run: |
          pytest -q \
            tests/test_ade12_leg_metrics_hardening.py \
            tests/test_ade12_data_integrity_cr.py \
            tests/test_ade12_authoritative_gap_path.py
